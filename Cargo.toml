[workspace]
members = [
    "apps/fubun-cli",
    "apps/fubun-linux-adapter",
    "apps/fubun-native-host",
    "apps/fubund",
    "crates/fubun-core",
    "crates/fubun-domain",
    "crates/fubun-policy",
    "crates/fubun-protocol",
    "crates/fubun-storage",
    "tests/integration",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/anythigok/fubun"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "=4.5.41", features = ["derive"] }
fubun-core = { path = "crates/fubun-core" }
fubun-domain = { path = "crates/fubun-domain" }
fubun-policy = { path = "crates/fubun-policy" }
fubun-protocol = { path = "crates/fubun-protocol" }
fubun-storage = { path = "crates/fubun-storage" }
proptest = "=1.7.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
schemars = { version = "=0.8.22", features = ["uuid1"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
tempfile = "=3.20.0"
thiserror = "=2.0.12"
time = { version = "=0.3.41", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.45.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["fmt"] }
url = "=2.5.2"
uuid = { version = "=1.16.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
